# ============================================================
# RequieMa Blog · MkDocs Material Configuration
# ============================================================

site_name: RequieMa
site_description: Personal blog about coding, complexity science, and more
site_url: https://requiema.github.io

# ------------------------------------------------------------------
# Repository (git integration — edit button, source link)
# ------------------------------------------------------------------
repo_name: RequieMa/requiema.github.io
repo_url: https://github.com/RequieMa/requiema.github.io
edit_uri: edit/Master/docs/

# ------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# ------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------
plugins:
  # Search — English + Chinese tokenization
  - search:
      lang:
        - en
        - zh

  # Blog
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      archive: true
      archive_name: Archive
      archive_url_format: "archive/{date}"
      categories: true
      categories_name: Categories
      categories_url_format: "category/{slug}"
      pagination: true
      pagination_per_page: 10
      pagination_url_format: "page/{page}"
      post_date_format: yyyy/MM/dd
      post_url_format: "{slug}"
      authors: true
      authors_file: "{blog}/.authors.yml"

  # Tags
  - tags

  # Social cards (OG/Twitter images auto-generated)
  # NOTE: CairoSVG rendering can be slow on WSL (~1-2 min per build).
  # Uncomment after verifying everything else works:
  # - social:
  #     cards: true
  #     cards_layout_options:
  #       font_family: Noto Sans SC
  #       background_color: "#4051b5"

  # RSS feed
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

  # Git revision dates on pages
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: date


# ------------------------------------------------------------------
# Markdown Extensions
# ------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------------
# Navigation
# ------------------------------------------------------------------
nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - Tags: tags.md
  - About: about.md

# ------------------------------------------------------------------
# Site Analytics (Google Analytics 4)
# ------------------------------------------------------------------
extra:
  analytics:
    provider: google
    property: G-RH1WYLCXK1
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

  # ------------------------------------------------------------------
  # Comments (giscus — GitHub Discussions)
  # ------------------------------------------------------------------
  comments:
    provider: giscus
    repo: RequieMa/requiema.github.io
    repo_id: R_kgDOTT8Quw
    category: Announcements
    category_id: DIC_kwDOTT8Qu84DA3zS
    mapping: pathname
    strict: false
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: bottom
    theme: preferred_color_scheme
    lang: en

  # ------------------------------------------------------------------
  # Social links (shown in page footer)
  # ------------------------------------------------------------------
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RequieMa
